<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML基礎レッスン</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Step 1: 見出しを書いてみよう -->
    <h1>HTMLの基礎を学ぼう</h1>

    <!-- Step 2: ここに <h2> と <p> を追加しよう -->
    <h1>自己紹介ページ</h1>

    <h2>はじめまして</h2>
    <p>私の名前は高田です。照明の勉強をしています</p>
    <p>趣味は漫画と猫と音楽です。</p>

    <h2>好きな食べ物</h2>
    <p>甘いもの全般</p>
    <!-- Step 3: ここに <ul> または <ol> のリストを追加しよう -->
    <h2>好きなものランキング</h2>
    <ol>
      <li class="highlight">百合</li>
      <li class="highlight">猫</li>
      <li class="highlight">音楽</li>
    </ol>
    <!-- Step 4: ここに <a> リンクと <img> 画像を追加しよう -->
    <h2>リンク</h2>
    <p><a href="https://www.ichijinsha.co.jp/yurihime/">Googleを開く</a></p>

    <h2>画像</h2>
    <img
      src="https://www.ichijinsha.co.jp/yurihime/uploads/sites/8/2026/04/7d9c580802e355ec8080310c155c0b8c.jpg"
      alt="画像サンプル"
    />
    <!-- Step 5: <div> でグループ化してみよう -->
    <div>
      <h1>自己紹介ページ</h1>

      <h2>はじめまして</h2>
      <p>私の名前は高田です。照明の勉強をしています</p>
      <p>趣味は漫画と猫と音楽です。</p>
    </div>

    <div>
      <h2>好きな食べ物</h2>
      <p>甘いもの全般</p>
      <!-- Step 3: ここに <ul> または <ol> のリストを追加しよう -->
      <h2>好きなものランキング</h2>
      <ol>
        <li class="highlight">百合</li>
        <li class="highlight">猫</li>
        <li class="highlight">音楽</li>
      </ol>
    </div>
    <div>
      <h2>リンク</h2>
      <p><a href="https://www.ichijinsha.co.jp/yurihime/">Googleを開く</a></p>

      <h2>画像</h2>
      <img
        src="https://www.ichijinsha.co.jp/yurihime/uploads/sites/8/2026/04/7d9c580802e355ec8080310c155c0b8c.jpg"
        alt="画像サンプル"
      />
    </div>
  </body>
</html>
